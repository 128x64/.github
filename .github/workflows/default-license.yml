name: Apply 128x64 Organization License Policy

on:
  # Run manually while the GitHub App is being configured.
  # Add a 15-minute schedule after LICENSE_BOT_APP_ID and
  # LICENSE_BOT_PRIVATE_KEY have been added as repository secrets.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-license-policy
  cancel-in-progress: false

jobs:
  apply-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the central policy repository
        uses: actions/checkout@v4

      - name: Create an organization-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LICENSE_BOT_APP_ID }}
          private-key: ${{ secrets.LICENSE_BOT_PRIVATE_KEY }}
          owner: 128x64
          permission-contents: write

      - name: Apply visibility-based licenses without overwriting
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          summary="$GITHUB_STEP_SUMMARY"
          echo "## 128x64 license policy scan" >> "$summary"
          echo "" >> "$summary"
          echo "Existing license files are never overwritten. Forks and archived repositories are skipped." >> "$summary"
          echo "" >> "$summary"

          repos="$(gh api --paginate 'orgs/128x64/repos?per_page=100&type=all' \
            --jq '.[] | [.full_name, .visibility, (.fork|tostring), (.archived|tostring), .default_branch] | @tsv')"

          if [[ -z "$repos" ]]; then
            echo "No repositories were returned. Check that the GitHub App is installed across the organization." >> "$summary"
            exit 0
          fi

          while IFS=$'\t' read -r repo visibility is_fork is_archived default_branch; do
            [[ -n "$repo" ]] || continue

            if [[ "$repo" == "128x64/.github" ]]; then
              continue
            fi

            if [[ "$is_fork" == "true" || "$is_archived" == "true" ]]; then
              echo "- Skipped **$repo** (fork or archived repository)." >> "$summary"
              continue
            fi

            if [[ -z "$default_branch" ]]; then
              echo "- Skipped **$repo** (no default branch yet)." >> "$summary"
              continue
            fi

            if [[ "$visibility" == "public" ]]; then
              license_source="licenses/Public_LICENSE.md"
              license_label="Public"
            else
              # Private and GitHub Enterprise internal repositories use the restricted license.
              license_source="licenses/Internal_LICENSE.md"
              license_label="Internal"
            fi

            existing_path=""
            inspection_failed="false"

            for candidate in LICENSE LICENSE.md LICENSE.txt COPYING COPYING.md; do
              endpoint="repos/$repo/contents/$candidate"
              first_line="$(gh api --include "$endpoint" 2>/dev/null | sed -n '1p' || true)"
              status_code="$(sed -E 's#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#' <<< "$first_line")"

              if [[ "$status_code" == "200" ]]; then
                existing_path="$candidate"
                break
              elif [[ "$status_code" != "404" ]]; then
                inspection_failed="true"
                echo "- Could not safely inspect **$repo** (HTTP status: ${status_code:-unknown}); no changes made." >> "$summary"
                break
              fi
            done

            if [[ "$inspection_failed" == "true" ]]; then
              continue
            fi

            if [[ -n "$existing_path" ]]; then
              echo "- Conflict: **$repo** already contains `$existing_path`. No changes made." >> "$summary"
              continue
            fi

            encoded_content="$(base64 -w 0 "$license_source")"
            if gh api --method PUT "repos/$repo/contents/LICENSE" \
              -f message="Add 128x64 $license_label repository license" \
              -f content="$encoded_content" \
              -f branch="$default_branch" >/dev/null; then
              echo "- Added the **$license_label** license to **$repo**." >> "$summary"
            else
              echo "- Failed to add the license to **$repo**. Check branch protection and App permissions." >> "$summary"
            fi
          done <<< "$repos"
