name: Apply 128x64 Organization License Policy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: organization-license-policy
  cancel-in-progress: false

jobs:
  apply-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the central policy repository
        uses: actions/checkout@v4

      - name: Create an organization-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LICENSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_BOT_PRIVATE_KEY }}
          owner: 128x64
          permission-contents: write

      - name: Apply visibility-based licenses without overwriting
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          summary="$GITHUB_STEP_SUMMARY"
          echo "## 128x64 license policy scan" >> "$summary"
          echo "" >> "$summary"
          echo "Public repositories receive Public_LICENSE.md; private repositories receive Internal_LICENSE.md. Existing license files are never overwritten." >> "$summary"
          echo "" >> "$summary"

          repos="$(gh api --paginate 'orgs/128x64/repos?per_page=100&type=all' \
            --jq '.[] | [.full_name, .visibility, (.fork|tostring), (.archived|tostring), .default_branch] | @tsv')"

          if [[ -z "$repos" ]]; then
            echo "No repositories were returned. Check that the App is installed on all 128x64 repositories." >> "$summary"
            exit 0
          fi

          while IFS=$'\t' read -r repo visibility is_fork is_archived default_branch; do
            [[ -n "$repo" ]] || continue

            if [[ "$repo" == "128x64/.github" ]]; then
              continue
            fi

            if [[ "$is_fork" == "true" || "$is_archived" == "true" ]]; then
              echo "- Skipped **$repo** (fork or archived repository)." >> "$summary"
              continue
            fi

            if [[ -z "$default_branch" ]]; then
              echo "- Skipped **$repo** (no default branch yet)." >> "$summary"
              continue
            fi

            if [[ "$visibility" == "public" ]]; then
              license_source="licenses/Public_LICENSE.md"
              license_label="Public"
            else
              license_source="licenses/Internal_LICENSE.md"
              license_label="Internal"
            fi

            if ! root_listing="$(gh api "repos/$repo/contents")"; then
              echo "- Could not safely inspect **$repo**. No changes made." >> "$summary"
              continue
            fi

            existing_licenses="$(jq -r '
              [.[] | select(.type == "file")
               | select(.name | test("^(LICENSE|LICENCE|COPYING)(\\.|$|-)|^UNLICENSE$"; "i"))
               | .name] | .[]
            ' <<< "$root_listing")"

            if [[ -n "$existing_licenses" ]]; then
              while IFS= read -r existing_path; do
                [[ -n "$existing_path" ]] && echo "- Conflict: **$repo** already contains `$existing_path`. No changes made." >> "$summary"
              done <<< "$existing_licenses"
              continue
            fi

            encoded_content="$(base64 -w 0 "$license_source")"
            if gh api --method PUT "repos/$repo/contents/LICENSE" \
              -f message="Add 128x64 $license_label repository license" \
              -f content="$encoded_content" \
              -f branch="$default_branch" >/dev/null; then
              echo "- Added the **$license_label** license to **$repo**." >> "$summary"
            else
              echo "- Failed to add a license to **$repo**. Check App permissions and branch protection." >> "$summary"
            fi
          done <<< "$repos"
